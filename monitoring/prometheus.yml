global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
  
  - job_name: "dcgm"
    static_configs:
      - targets:
          - "10.11.2.12:9400"

  - job_name: "gateway"
    static_configs:
      - targets: ["frontend:3000"]
