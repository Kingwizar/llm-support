<div class="input-bar">
  <!-- Champ texte -->
  <input
    [(ngModel)]="prompt"
    type="text"
    placeholder="Écris ton message..."
    (keydown.enter)="onEnter($event)" />

  <!-- Bouton d’ajout de fichiers -->
  <button class="upload-btn" (click)="fileInput.click()">📁</button>
  <input #fileInput type="file" multiple hidden (change)="onFileSelect($event)" />

  <!-- Bouton d’envoi -->
  <button class="send-btn" (click)="sendMessage()">Envoyer</button>
</div>

<!-- Fichiers sélectionnés -->
<div class="selected-files" *ngIf="selectedFiles.length">
  <div class="file" *ngFor="let file of selectedFiles; let i = index">
    {{ file.name }}
    <span class="remove" (click)="removeFile(i)">✖</span>
  </div>
</div>
