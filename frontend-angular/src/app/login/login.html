<div class="auth-container">
  <h2>Connexion</h2>

  <input type="email" [(ngModel)]="email" placeholder="Email" />
  <input type="password" [(ngModel)]="password" placeholder="Mot de passe" />

  <!-- Bouton principal -->
  <button class="primary-btn" (click)="login()">Se connecter</button>

  <!-- OAuth buttons -->
  <div class="oauth-buttons round">
    <!-- Google -->
    <button class="oauth-btn google" (click)="loginAuth0('google')">
  <img
    src="icon/Google.svg"
    alt="Google"
    class="oauth-icon google-icon"
  />
</button>



    <!-- Microsoft -->
    <button class="oauth-btn" (click)="loginAuth0('microsoft')">
      <svg viewBox="0 0 23 23">
        <path fill="#f25022" d="M1 1h10v10H1z"/>
        <path fill="#7fba00" d="M12 1h10v10H12z"/>
        <path fill="#00a4ef" d="M1 12h10v10H1z"/>
        <path fill="#ffb900" d="M12 12h10v10H12z"/>
      </svg>
    </button>

  </div>

  <p class="register-link">
    Pas encore de compte ?
    <a routerLink="/register">Créer un compte</a>
  </p>

  <p class="error" *ngIf="error">{{ error }}</p>
</div>
