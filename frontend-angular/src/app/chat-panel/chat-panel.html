<div class="chat-panel">
  <h3 *ngIf="activeConversation">💬 {{ activeConversation.name }}</h3>

  <div class="messages">
    <div *ngFor="let msg of messages" [ngClass]="msg.role">
      <span *ngIf="msg.role === 'user'"> </span>
      <span *ngIf="msg.role === 'bot'"> </span>
      {{ msg.content }}
    </div>
    
  </div>
  

  <app-input-bar class="input-bar" (send)="onSendMessage($event)"></app-input-bar>
</div>
