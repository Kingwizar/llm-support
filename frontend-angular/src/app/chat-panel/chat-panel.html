<div class="chat-panel">
  <h3 *ngIf="activeConversation">💬 {{ activeConversation.name }}</h3>

  <div class="messages">
    <div *ngFor="let msg of messages" [ngClass]="msg.role">
      <div class="bubble">

        <!-- 💬 Texte classique -->
        <div class="text" *ngIf="!msg.file_url">{{ msg.content }}</div>

        <!-- 📁 Message contenant un fichier -->
        <div class="file-message" *ngIf="msg.file_url">
          <a [href]="msg.file_url" target="_blank" download class="file-link">
            <img [src]="getFileIcon(msg.content)" class="file-icon" alt="file" />
            <span>{{ cleanFilename(msg.content) }}</span>
          </a>
        </div>

        <!-- (optionnel) anciens messages avec plusieurs fichiers -->
        <div *ngIf="msg.files?.length" class="file-list">
          <div *ngFor="let file of msg.files" class="file-item">
            <a [href]="file.url" target="_blank" download class="file-link">
              <img [src]="getFileIcon(file.filename)" class="file-icon" />
              <span>{{ file.filename }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-input-bar
    class="input-bar"
    [convId]="activeConversation?._id"
    (send)="onSendMessage($event)">
  </app-input-bar>
</div>
